name: Import Sem.01 source

on:
  push:
    branches: [main]
    paths: [sem01-source.zip]

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source
        run: |
          unzip -o sem01-source.zip
          rm sem01-source.zip .github/workflows/import-source.yml
      - name: Commit complete project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete Sem.01 project"
          git push
